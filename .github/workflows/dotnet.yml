name: CloudCart CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACA_ENVIRONMENT: ${{ vars.ACA_ENVIRONMENT }}


# =========================================================
# 1. CI - Dependencies, Tests, Compilation
# =========================================================

jobs:

  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Locate eShop solution automatically
      # -----------------------------------------------------

      - name: Find eShop solution
        shell: bash
        run: |
          echo "Repository root:"
          pwd

          echo "Searching for eShop.slnx..."

          SOLUTION_PATH=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "eShop.slnx" \
            -print \
            -quit)

          if [ -z "$SOLUTION_PATH" ]; then
            echo "ERROR: eShop.slnx was not found."

            echo "Repository structure:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type d

            exit 1
          fi

          APP_ROOT=$(dirname "$SOLUTION_PATH")

          echo "Solution found:"
          echo "$SOLUTION_PATH"

          echo "Application root:"
          echo "$APP_ROOT"

          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # .NET SDK
      # -----------------------------------------------------

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET information
        run: |
          dotnet --version
          dotnet --info

      # -----------------------------------------------------
      # Backend-only dependency installation
      # MAUI projects are intentionally excluded on Ubuntu
      # -----------------------------------------------------

      - name: Restore backend dependencies
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          set -e

          PROJECTS=(
            "src/Catalog.API/Catalog.API.csproj"
            "src/Basket.API/Basket.API.csproj"
            "src/Ordering.API/Ordering.API.csproj"
            "src/Identity.API/Identity.API.csproj"
            "src/Webhooks.API/Webhooks.API.csproj"
            "src/OrderProcessor/OrderProcessor.csproj"
            "src/PaymentProcessor/PaymentProcessor.csproj"
            "src/WebApp/WebApp.csproj"
            "src/WebhookClient/WebhookClient.csproj"
          )

          for project in "${PROJECTS[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project"
          done

      # -----------------------------------------------------
      # Dependency Security Scan
      # -----------------------------------------------------

      - name: Scan backend NuGet dependencies
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          set -e

          : > dependency-audit.txt

          PROJECTS=(
            "src/Catalog.API/Catalog.API.csproj"
            "src/Basket.API/Basket.API.csproj"
            "src/Ordering.API/Ordering.API.csproj"
            "src/Identity.API/Identity.API.csproj"
            "src/Webhooks.API/Webhooks.API.csproj"
            "src/OrderProcessor/OrderProcessor.csproj"
            "src/PaymentProcessor/PaymentProcessor.csproj"
            "src/WebApp/WebApp.csproj"
            "src/WebhookClient/WebhookClient.csproj"
          )

          for project in "${PROJECTS[@]}"; do
            echo "Scanning $project" | tee -a dependency-audit.txt

            dotnet list "$project" package \
              --vulnerable \
              --include-transitive | tee -a dependency-audit.txt
          done

      # -----------------------------------------------------
      # Automated Unit Testing
      # -----------------------------------------------------

      - name: Run backend tests
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          set -e

          mapfile -d '' TEST_PROJECTS < <(
            find tests -type f \
              \( -name "*Tests.csproj" -o -name "*Test.csproj" \) \
              ! -path "*/ClientApp.UnitTests/*" \
              ! -path "*/HybridApp*/*" \
              -print0
          )

          if [ "${#TEST_PROJECTS[@]}" -eq 0 ]; then
            echo "No backend test projects found."
            exit 0
          fi

          for project in "${TEST_PROJECTS[@]}"; do
            echo "Testing $project"

            dotnet test "$project" \
              --configuration Release \
              --results-directory TestResults
          done

      # -----------------------------------------------------
      # Backend Compilation
      # -----------------------------------------------------

      - name: Build backend projects
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          set -e

          PROJECTS=(
            "src/Catalog.API/Catalog.API.csproj"
            "src/Basket.API/Basket.API.csproj"
            "src/Ordering.API/Ordering.API.csproj"
            "src/Identity.API/Identity.API.csproj"
            "src/Webhooks.API/Webhooks.API.csproj"
            "src/OrderProcessor/OrderProcessor.csproj"
            "src/PaymentProcessor/PaymentProcessor.csproj"
            "src/WebApp/WebApp.csproj"
            "src/WebhookClient/WebhookClient.csproj"
          )

          for project in "${PROJECTS[@]}"; do
            echo "Building $project"

            dotnet build "$project" \
              --configuration Release \
              --no-restore
          done

      # -----------------------------------------------------
      # Test Artifacts
      # -----------------------------------------------------

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcart-test-results
          path: ${{ env.APP_ROOT }}/TestResults
          if-no-files-found: ignore

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: ${{ env.APP_ROOT }}/dependency-audit.txt
          if-no-files-found: ignore

    # =========================================================
  # SONARQUBE CODE QUALITY ANALYSIS
  # =========================================================

  sonarqube:
    name: SonarQube Code Analysis

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    needs:
      - ci

    outputs:
      quality_gate: ${{ steps.sonar-results.outputs.quality_gate }}
      open_issues: ${{ steps.sonar-results.outputs.open_issues }}

    steps:

      # -----------------------------------------------------
      # Checkout complete Git history
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------
      # Setup .NET
      # -----------------------------------------------------

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # -----------------------------------------------------
      # Find eShop root
      # -----------------------------------------------------

      - name: Find eShop solution
        shell: bash
        run: |
          set -e

          SOLUTION_PATH=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "eShop.Web.slnf" \
            -print \
            -quit)

          if [ -z "$SOLUTION_PATH" ]; then
            echo "ERROR: eShop.Web.slnf was not found."
            exit 1
          fi

          APP_ROOT=$(dirname "$SOLUTION_PATH")

          echo "Solution found:"
          echo "$SOLUTION_PATH"

          echo "Application root:"
          echo "$APP_ROOT"

          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # Install SonarScanner
      # -----------------------------------------------------

      - name: Install SonarScanner for .NET
        shell: bash
        run: |
          dotnet tool install \
            --global dotnet-sonarscanner

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      # -----------------------------------------------------
      # Validate SonarQube configuration
      # -----------------------------------------------------
      - name: SonarQube Begin
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          echo "Starting SonarQube Cloud analysis..."
          echo "Host: $SONAR_HOST_URL"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Organization: $SONAR_ORGANIZATION"

          dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN"



      # -----------------------------------------------------
      # Start SonarQube analysis
      # -----------------------------------------------------

      - name: SonarQube Begin
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN"

      # -----------------------------------------------------
      # Build application while scanner is active
      # -----------------------------------------------------

      - name: Build for SonarQube
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          dotnet build eShop.Web.slnf \
            --configuration Release

      # -----------------------------------------------------
      # Upload analysis to SonarQube
      # -----------------------------------------------------

      - name: SonarQube End
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"

      # -----------------------------------------------------
      # Wait until SonarQube finishes processing
      # -----------------------------------------------------

      - name: Wait for SonarQube analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          set -e

          REPORT_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -path "*/.sonarqube/out/.sonar/report-task.txt" \
            -print \
            -quit)

          if [ -z "$REPORT_FILE" ]; then
            echo "Unable to locate report-task.txt"
            exit 1
          fi

          CE_TASK_URL=$(grep '^ceTaskUrl=' "$REPORT_FILE" | cut -d= -f2-)

          echo "SonarQube task:"
          echo "$CE_TASK_URL"

          for i in {1..30}; do

            RESPONSE=$(curl \
              --silent \
              --fail \
              -u "${SONAR_TOKEN}:" \
              "$CE_TASK_URL")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status')

            echo "SonarQube processing status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] ||
               [ "$STATUS" = "CANCELED" ]; then
              echo "SonarQube processing failed."
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for SonarQube."
          exit 1

      # -----------------------------------------------------
      # Collect Quality Gate + Open Issues
      # -----------------------------------------------------

      - name: Collect SonarQube results
        id: sonar-results
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail

          QUALITY_RESPONSE=$(curl \
            --silent \
            --fail \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}")

          RAW_STATUS=$(echo "$QUALITY_RESPONSE" |
            jq -r '.projectStatus.status')

          if [ "$RAW_STATUS" = "OK" ]; then
            QUALITY_GATE="PASSED"
          else
            QUALITY_GATE="FAILED"
          fi

          ISSUES_RESPONSE=$(curl \
            --silent \
            --fail \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&resolved=false&ps=1")

          OPEN_ISSUES=$(echo "$ISSUES_RESPONSE" |
            jq -r '.total')

          echo "Quality Gate: $QUALITY_GATE"
          echo "Open Issues: $OPEN_ISSUES"

          echo "quality_gate=$QUALITY_GATE" >> "$GITHUB_OUTPUT"
          echo "open_issues=$OPEN_ISSUES" >> "$GITHUB_OUTPUT"

    # =========================================================
  # SONARQUBE SLACK NOTIFICATION
  # =========================================================

  sonar-slack:
    name: SonarQube Slack Notification

    runs-on: ubuntu-latest

    needs:
      - sonarqube

    if: always() && needs.sonarqube.result == 'success'

    steps:

      - name: Prepare SonarQube Slack message
        id: slack-data
        shell: bash
        env:
          QUALITY_GATE: ${{ needs.sonarqube.outputs.quality_gate }}
          FULL_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${FULL_SHA:0:7}"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [ "$QUALITY_GATE" = "PASSED" ]; then
            echo "quality_icon=✅" >> "$GITHUB_OUTPUT"
          else
            echo "quality_icon=❌" >> "$GITHUB_OUTPUT"
          fi

      - name: Send SonarQube result to Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true

          payload: |
            {
              "text": "SonarQube Scan Result for ${{ github.repository }}",
              "attachments": [
                {
                  "color": "${{ needs.sonarqube.outputs.quality_gate == 'PASSED' && '#2eb886' || '#e01e5a' }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "SonarQube Scan Result for ${{ github.repository }}",
                        "emoji": true
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Pushed By:*\n${{ github.actor }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch:*\n${{ github.ref_name }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit:*\n`${{ steps.slack-data.outputs.short_sha }}`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Quality Gate:*\n${{ steps.slack-data.outputs.quality_icon }} *${{ needs.sonarqube.outputs.quality_gate }}*"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Total Open Issues:* ${{ needs.sonarqube.outputs.open_issues }}"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Dashboard"
                          },
                          "url": "${{ vars.SONAR_HOST_URL }}/dashboard?id=${{ vars.SONAR_PROJECT_KEY }}"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Pipeline Run"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }

  # =========================================================
  # SONARQUBE QUALITY GATE ENFORCEMENT
  # =========================================================

  sonar-quality-gate:
    name: SonarQube Quality Gate

    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - sonar-slack

    if: always() && needs.sonarqube.result == 'success'

    steps:
      - name: Enforce SonarQube Quality Gate
        shell: bash
        env:
          QUALITY_GATE: ${{ needs.sonarqube.outputs.quality_gate }}
        run: |
          echo "SonarQube Quality Gate: $QUALITY_GATE"

          if [ "$QUALITY_GATE" != "PASSED" ]; then
            echo "❌ SonarQube Quality Gate FAILED."
            echo "Deployment will not continue."
            exit 1
          fi

          echo "✅ SonarQube Quality Gate PASSED."
          echo "Deployment may continue."

  # =========================================================
  # 2. CODE SECURITY SCANNING
  # =========================================================

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find eShop solution
        shell: bash
        run: |
          echo "Searching for eShop.slnx..."

          SOLUTION_PATH=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "eShop.slnx" \
            -print \
            -quit)

          if [ -z "$SOLUTION_PATH" ]; then
            echo "ERROR: eShop.slnx was not found."
            exit 1
          fi

          APP_ROOT=$(dirname "$SOLUTION_PATH")

          echo "Solution found:"
          echo "$SOLUTION_PATH"

          echo "Application root:"
          echo "$APP_ROOT"

          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Restore and build backend projects for CodeQL
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          set -e

          PROJECTS=(
            "src/Catalog.API/Catalog.API.csproj"
            "src/Basket.API/Basket.API.csproj"
            "src/Ordering.API/Ordering.API.csproj"
            "src/Identity.API/Identity.API.csproj"
            "src/Webhooks.API/Webhooks.API.csproj"
            "src/OrderProcessor/OrderProcessor.csproj"
            "src/PaymentProcessor/PaymentProcessor.csproj"
            "src/WebApp/WebApp.csproj"
            "src/WebhookClient/WebhookClient.csproj"
          )

          for project in "${PROJECTS[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project"

            echo "Building $project"

            dotnet build "$project" \
              --configuration Release \
              --no-restore
          done

      - name: Analyze source code
        uses: github/codeql-action/analyze@v3


  # =========================================================
  # 3. INFRASTRUCTURE PROVISIONING
  # =========================================================

  infrastructure:
    name: Provision Azure Infrastructure

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - ci
      - codeql
      - sonar-quality-gate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Azure OIDC Authentication
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------
      # Verify Azure Authentication
      # -----------------------------------------------------

      - name: Verify Azure Login
        run: |
          echo "Azure authentication successful."

          az account show \
            --query "{Subscription:name,SubscriptionId:id,TenantId:tenantId}" \
            --output table

      # -----------------------------------------------------
      # IMPORTANT:
      # Azure Resource Provider registration removed.
      #
      # Register these manually once in Azure:
      # Microsoft.ContainerRegistry
      # Microsoft.App
      # Microsoft.OperationalInsights
      # -----------------------------------------------------

      # -----------------------------------------------------
      # Resource Group
      # rg-cloudcart-dev already exists and is managed in Azure.
      # Creation is intentionally omitted from this workflow.
      # -----------------------------------------------------

      # -----------------------------------------------------
      # Azure Container Registry
      # -----------------------------------------------------

      - name: Provision Azure Container Registry
        shell: bash
        run: |
          if az acr show \
              --name "$ACR_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              >/dev/null 2>&1
          then
            echo "ACR already exists."
          else
            echo "Creating ACR..."

            az acr create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$ACR_NAME" \
              --sku Basic
          fi

      # -----------------------------------------------------
      # Azure Container Apps CLI Extension
      # -----------------------------------------------------

      - name: Install Container Apps extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade

      # -----------------------------------------------------
      # Container Apps Environment
      # -----------------------------------------------------

      - name: Provision Container Apps Environment
        shell: bash
        run: |
          if az containerapp env show \
              --name "$ACA_ENVIRONMENT" \
              --resource-group "$RESOURCE_GROUP" \
              >/dev/null 2>&1
          then
            echo "Container Apps environment already exists."
          else
            echo "Creating Container Apps environment..."

            az containerapp env create \
              --name "$ACA_ENVIRONMENT" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION"
          fi


      # -----------------------------------------------------
      # Managed identity used by Container Apps to pull ACR images
      # -----------------------------------------------------

      - name: Provision ACR pull managed identity
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY_NAME="cloudcart-acr-pull"

          if az identity show \
              --name "$IDENTITY_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              >/dev/null 2>&1
          then
            echo "Managed identity already exists."
          else
            echo "Creating managed identity..."

            az identity create \
              --name "$IDENTITY_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --output none
          fi

          IDENTITY_ID=$(az identity show \
            --name "$IDENTITY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv)

          PRINCIPAL_ID=$(az identity show \
            --name "$IDENTITY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query principalId \
            --output tsv)

          ACR_ID=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv)

          echo "Assigning AcrPull permission to managed identity..."

          az role assignment create \
            --assignee "$PRINCIPAL_ID" \
            --role "AcrPull" \
            --scope "$ACR_ID" \
            || echo "AcrPull role already exists"

          echo "Managed identity: $IDENTITY_ID"
          echo "Principal ID: $PRINCIPAL_ID"
          echo "ACR pull permission configured."


  # =========================================================
  # 4. CONTAINERIZATION + REGISTRY UPLOAD
  # =========================================================

  docker:
    name: Docker - ${{ matrix.app }}

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - infrastructure

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - app: catalog-api
            image: eshop-catalog-api
            dockerfile: src/Catalog.API/Dockerfile

          - app: basket-api
            image: eshop-basket-api
            dockerfile: src/Basket.API/Dockerfile

          - app: ordering-api
            image: eshop-ordering-api
            dockerfile: src/Ordering.API/Dockerfile

          - app: identity-api
            image: eshop-identity-api
            dockerfile: src/Identity.API/Dockerfile

          - app: webhooks-api
            image: eshop-webhooks-api
            dockerfile: src/Webhooks.API/Dockerfile

          - app: order-processor
            image: eshop-order-processor
            dockerfile: src/OrderProcessor/Dockerfile

          - app: payment-processor
            image: eshop-payment-processor
            dockerfile: src/PaymentProcessor/Dockerfile

          - app: webapp
            image: eshop-webapp
            dockerfile: src/WebApp/Dockerfile

          - app: webhook-client
            image: eshop-webhook-client
            dockerfile: src/WebhookClient/Dockerfile

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find eShop solution
        shell: bash
        run: |
          SOLUTION_PATH=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "eShop.slnx" \
            -print \
            -quit)

          if [ -z "$SOLUTION_PATH" ]; then
            echo "ERROR: eShop.slnx was not found."
            exit 1
          fi

          APP_ROOT=$(dirname "$SOLUTION_PATH")

          echo "Solution:"
          echo "$SOLUTION_PATH"

          echo "Application root:"
          echo "$APP_ROOT"

          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # Azure Authentication
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------
      # Azure Container Registry Authentication
      # -----------------------------------------------------

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      # -----------------------------------------------------
      # Prepare Image Name
      # -----------------------------------------------------

      - name: Prepare image name
        run: |
          echo \
          "IMAGE=${ACR_NAME}.azurecr.io/${{ matrix.image }}:${GITHUB_SHA}" \
          >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # Docker Build
      # -----------------------------------------------------

      - name: Build Docker image
        working-directory: ${{ env.APP_ROOT }}
        run: |
          echo "Building application: ${{ matrix.app }}"
          echo "Dockerfile: ${{ matrix.dockerfile }}"
          echo "Image: $IMAGE"

          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "$IMAGE" \
            .

      # -----------------------------------------------------
      # Container Security Scan
      # -----------------------------------------------------

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      # -----------------------------------------------------
      # Push Image to ACR
      # -----------------------------------------------------

      - name: Push image to Azure Container Registry
        run: |
          docker push "$IMAGE"


  # =========================================================
  # 5. SERVER DEPLOYMENT
  # Azure Container Apps
  # =========================================================

  deploy:
    name: Deploy - ${{ matrix.app }}

    needs:
      - docker

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - app: catalog-api
            image: eshop-catalog-api
            ingress: internal

          - app: basket-api
            image: eshop-basket-api
            ingress: internal

          - app: ordering-api
            image: eshop-ordering-api
            ingress: internal

          - app: identity-api
            image: eshop-identity-api
            ingress: external

          - app: webhooks-api
            image: eshop-webhooks-api
            ingress: internal

          - app: order-processor
            image: eshop-order-processor
            ingress: disabled

          - app: payment-processor
            image: eshop-payment-processor
            ingress: disabled

          - app: webapp
            image: eshop-webapp
            ingress: external

          - app: webhook-client
            image: eshop-webhook-client
            ingress: external

    steps:

      # -----------------------------------------------------
      # Azure Authentication
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------
      # Deploy to Azure Container Apps
      # -----------------------------------------------------

      - name: Install Container Apps extension
        shell: bash
        run: |
          az extension add --name containerapp --upgrade

      - name: Deploy Container App
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY_NAME="cloudcart-acr-pull"

          IDENTITY_ID=$(az identity show \
            --name "$IDENTITY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv)

          if [ -z "$IDENTITY_ID" ]; then
            echo "ERROR: Managed identity not found."
            exit 1
          fi

          IMAGE="${ACR_NAME}.azurecr.io/${{ matrix.image }}:${GITHUB_SHA}"

          echo "================================="
          echo "Deploying: ${{ matrix.app }}"
          echo "Image: $IMAGE"
          echo "================================="

          echo "Checking existing Container App..."

          if az containerapp show \
              --name "${{ matrix.app }}" \
              --resource-group "$RESOURCE_GROUP" \
              >/dev/null 2>&1
          then

            STATE=$(az containerapp show \
              --name "${{ matrix.app }}" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.provisioningState \
              --output tsv)

            echo "Current state: $STATE"

            if [ "$STATE" = "Failed" ]; then

              echo "Deleting failed Container App..."

              az containerapp delete \
                --name "${{ matrix.app }}" \
                --resource-group "$RESOURCE_GROUP" \
                --yes

              sleep 30

            fi
          fi

          echo "Creating Container App..."

          if [ "${{ matrix.ingress }}" = "disabled" ]; then

            az containerapp create \
              --name "${{ matrix.app }}" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENVIRONMENT" \
              --image "$IMAGE" \
              --user-assigned "$IDENTITY_ID" \
              --registry-server "${ACR_NAME}.azurecr.io" \
              --registry-identity "$IDENTITY_ID"

          else

            az containerapp create \
              --name "${{ matrix.app }}" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENVIRONMENT" \
              --image "$IMAGE" \
              --user-assigned "$IDENTITY_ID" \
              --registry-server "${ACR_NAME}.azurecr.io" \
              --registry-identity "$IDENTITY_ID" \
              --ingress "${{ matrix.ingress }}" \
              --target-port 8080

          fi

          echo "Deployment completed for ${{ matrix.app }}."




  # =========================================================
  # 6. PRODUCTION SMOKE TEST
  # =========================================================

  smoke-test:
    name: Production Smoke Test

    needs:
      - deploy

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Azure Authentication
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------
      # Obtain WebApp URL
      # -----------------------------------------------------

      - name: Get WebApp URL
        shell: bash
        run: |
          WEBAPP_FQDN=$(az containerapp show \
            --name webapp \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          if [ -z "$WEBAPP_FQDN" ]; then
            echo "ERROR: WebApp FQDN could not be determined."
            exit 1
          fi

          echo "WEBAPP_URL=https://${WEBAPP_FQDN}" >> "$GITHUB_ENV"

          echo "Testing:"
          echo "https://${WEBAPP_FQDN}"

      # -----------------------------------------------------
      # Smoke Test
      # -----------------------------------------------------

      - name: Smoke test WebApp
        shell: bash
        run: |
          for i in {1..12}
          do

            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$WEBAPP_URL" || true)

            echo "Attempt $i → HTTP $STATUS"

            if [ "$STATUS" = "200" ] ||
               [ "$STATUS" = "302" ]
            then
              echo "Smoke test passed."
              exit 0
            fi

            sleep 10

          done

          echo "Smoke test failed."
          exit 1


  # =========================================================
  # 7. SLACK SUCCESS NOTIFICATION
  # =========================================================

  slack-success:
    name: Slack Notification

    needs:
      - smoke-test

    if: success()

    runs-on: ubuntu-latest

    steps:

      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

          payload: |
            {
              "text": "✅ CloudCart deployment successful!\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
