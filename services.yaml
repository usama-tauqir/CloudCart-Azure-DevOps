# ---------- eshop-identity-api ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-identity-api
  namespace: eshop
spec:
  replicas: 1
  selector: { matchLabels: { app: eshop-identity-api } }
  template:
    metadata: { labels: { app: eshop-identity-api } }
    spec:
      imagePullSecrets: [{ name: acr-secret }]
      containers:
      - name: app
        image: eshopacr2026.azurecr.io/eshop-identity-api:v1
        ports: [{ containerPort: 8080 }]
        envFrom:
        - configMapRef: { name: eshop-config }
        env:
        - { name: ConnectionStrings__identity, value: "Data Source=/tmp/identity.db" }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "400Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: eshop-identity-api
  namespace: eshop
spec:
  selector: { app: eshop-identity-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
# ---------- eshop-catalog-api ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-catalog-api
  namespace: eshop
spec:
  replicas: 1
  selector: { matchLabels: { app: eshop-catalog-api } }
  template:
    metadata: { labels: { app: eshop-catalog-api } }
    spec:
      imagePullSecrets: [{ name: acr-secret }]
      containers:
      - name: app
        image: eshopacr2026.azurecr.io/eshop-catalog-api:v1
        ports: [{ containerPort: 8080 }]
        envFrom:
        - configMapRef: { name: eshop-config }
        env:
        - { name: ConnectionStrings__catalog, value: "Server=mssql;Database=CatalogDb;User Id=sa;Password=Pass@word1;TrustServerCertificate=true" }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "400Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: eshop-catalog-api
  namespace: eshop
spec:
  selector: { app: eshop-catalog-api }
  ports: [{ port: 80, targetPort: 8080 }]
